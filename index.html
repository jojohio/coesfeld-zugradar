<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>Coesfeld Zugradar</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:#fff;padding:18px 16px}h1{margin:0;font-size:22px}.sub{color:#d1d5db;font-size:13px;margin-top:4px}
main{max-width:760px;margin:auto;padding:14px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
button,select{font:inherit;padding:11px;border-radius:10px;border:1px solid #d1d5db;background:#fff}button{background:#111827;color:#fff;font-weight:700}
.card{background:#fff;padding:13px;margin:8px 0;border-radius:13px;border-left:5px solid #22c55e;box-shadow:0 1px 3px #0001}
.card.late{border-left-color:#f59e0b}.card.big{border-left-color:#ef4444}.card.cancel{border-left-color:#7c3aed}
.row{display:flex;justify-content:space-between;gap:8px}.train,.status{font-weight:800}.meta{color:#4b5563;font-size:14px;margin-top:5px}
.small{color:#6b7280;font-size:12px}.error{background:#fee2e2;padding:12px;border-radius:10px}
</style></head>
<body><header><h1>🚆 Coesfeld Zugradar</h1><div class="sub">Live-Ankünfte Coesfeld (Westf)</div></header>
<main><div class="bar"><button id="reload">Aktualisieren</button>
<select id="filter"><option value="">Ankommend aus …</option><option>Dülmen</option><option>Münster</option><option>Dortmund</option><option>Gronau</option><option>Dorsten</option></select></div>
<div id="stamp" class="small">Lade Daten …</div><div id="list"></div>
<p class="small">Die Zugdaten werden live über den Zugradar-Server geladen. Bereits geladene Ankünfte werden zusätzlich lokal auf diesem Gerät gespeichert.</p></main>
<script>
const API='https://coesfeld-zugradar.vercel.app/api/arrivals';
const list=document.querySelector('#list'),stamp=document.querySelector('#stamp'),filter=document.querySelector('#filter');
const day=()=>new Date().toISOString().slice(0,10),key=()=> 'coesfeld-zugradar:'+day();
const fmt=x=>x?new Date(x).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'–';
const id=x=>x.tripId||[x.line?.name,x.plannedWhen,x.origin?.name].join('|');
function saved(){try{return JSON.parse(localStorage.getItem(key())||'[]')}catch{return[]}}
function merge(a,b){let m=new Map(a.map(x=>[id(x),x]));b.forEach(x=>m.set(id(x),{...(m.get(id(x))||{}),...x}));return [...m.values()].sort((a,b)=>new Date(a.plannedWhen)-new Date(b.plannedWhen))}
function delay(x){return Number.isFinite(x.delay)?Math.round(x.delay/60):(x.when&&x.plannedWhen?Math.round((new Date(x.when)-new Date(x.plannedWhen))/60000):0)}
function render(a){const f=filter.value.toLowerCase();a=a.filter(x=>!f||JSON.stringify(x).toLowerCase().includes(f));list.innerHTML='';
if(!a.length){list.innerHTML='<p>Keine passenden Ankünfte gefunden.</p>';return}
a.forEach(x=>{let d=delay(x),cl=x.cancelled?'cancel':d>=10?'big':d>0?'late':'',st=x.cancelled?'Ausfall':d>0?'+'+d+' Min':'pünktlich';
let e=document.createElement('div');e.className='card '+cl;e.innerHTML='<div class="row"><span class="train">'+(x.line?.name||'Zug')+'</span><span class="status">'+st+'</span></div><div class="meta">aus '+(x.origin?.name||'unbekannt')+(x.platform?' · Gleis '+x.platform:'')+'</div><div class="meta">Soll <b>'+fmt(x.plannedWhen)+'</b> · Ist <b>'+fmt(x.when)+'</b></div>';list.appendChild(e)})}
async function load(){stamp.textContent='Live-Daten werden geladen …';try{let r=await fetch(API);if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json(),fresh=j.arrivals||[],all=merge(saved(),fresh);localStorage.setItem(key(),JSON.stringify(all));render(all);stamp.textContent='Datenstand: '+(j.updatedAt?new Date(j.updatedAt).toLocaleTimeString('de-DE'):'unbekannt')}catch(e){render(saved());stamp.innerHTML='<span class="error">Live-Abruf fehlgeschlagen: '+e.message+'</span>'}}
document.querySelector('#reload').onclick=load;filter.onchange=()=>render(saved());load();
</script></body></html>
