name: Coesfeld Zugradar Daten

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 4-12 * * 1-5"

permissions:
  contents: write

jobs:
  update-trains:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Coesfeld arrivals
        shell: bash
        run: |
          mkdir -p data
          curl -fL --retry 3             "https://v6.db.transport.rest/stops/8000066/arrivals?duration=360&results=100"             -o data/raw.json
          python3 -c 'import json,datetime; p="data/raw.json"; x=json.load(open(p)); a=x if isinstance(x,list) else x.get("arrivals",[]); json.dump({"updatedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),"arrivals":a},open("data/arrivals.json","w"),ensure_ascii=False)'
          rm data/raw.json

      - name: Save data
        shell: bash
        run: |
          git config user.name "Coesfeld Zugradar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/arrivals.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update train data"
            git push
          fi
